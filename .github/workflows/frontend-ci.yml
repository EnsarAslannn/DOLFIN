name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  # A vulnerability is disclosed against a dependency that has not changed,
  # in code that has not changed, so nothing here would ever run to find it.
  # Both workflows wake up weekly for that reason alone.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The backend has had `dotnet list package --vulnerable` since its
      # workflow was written; the frontend had no equivalent, so a known
      # advisory against anything in node_modules went unreported here.
      #
      # It gates on high and above rather than on everything: a moderate
      # advisory in a dev-only dependency should be visible in the log, not
      # a red build that blocks an unrelated change until someone upstream
      # ships a patch. `npm audit` alone never fails the step, so the two
      # runs are deliberate -- the first reports, the second decides.
      - name: Report known vulnerabilities
        run: npm audit || true

      - name: Fail on high or critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        timeout-minutes: 5

      - name: E2E tests
        run: npm run test:e2e
        timeout-minutes: 10
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
