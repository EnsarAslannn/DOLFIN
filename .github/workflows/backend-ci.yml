name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pins CLI output to English regardless of runner locale -- the
      # "vulnerable packages" grep check below matches on English text.
      DOTNET_CLI_UI_LANGUAGE: en

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # api.csproj deliberately excludes api.Tests/**/*.cs from its own
      # compile (see the <Compile Remove> in api.csproj), so restoring/
      # building/testing api.csproj alone never touches api.Tests -- "dotnet
      # test" against it silently succeeds with zero tests discovered.
      # Targeting api.Tests.csproj (which references api.csproj) is what
      # actually exercises the suite; without this the CI "Test" step was a
      # no-op that always reported success.
      - name: Restore
        working-directory: backend
        run: dotnet restore api.Tests/api.Tests.csproj

      - name: Check formatting
        working-directory: backend
        run: |
          dotnet format api.csproj --verify-no-changes --severity warn
          dotnet format api.Tests/api.Tests.csproj --verify-no-changes --severity warn

      - name: Build
        working-directory: backend
        run: dotnet build api.Tests/api.Tests.csproj --no-restore --configuration Release

      - name: Test
        working-directory: backend
        run: dotnet test api.Tests/api.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Check for vulnerable packages
        working-directory: backend
        run: |
          dotnet list api.Tests/api.Tests.csproj package --vulnerable --include-transitive | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_UI_LANGUAGE: en

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Same reasoning as api.Tests above: api.IntegrationTests is also
      # excluded from api.csproj's own compile, so it must be targeted
      # directly. Testcontainers pulls and starts real Postgres 17 + Redis
      # containers, which ubuntu-latest runners support out of the box via
      # the preinstalled Docker daemon -- no docker-compose service block
      # needed.
      - name: Restore
        working-directory: backend
        run: dotnet restore api.IntegrationTests/api.IntegrationTests.csproj

      - name: Check formatting
        working-directory: backend
        run: dotnet format api.IntegrationTests/api.IntegrationTests.csproj --verify-no-changes --severity warn

      - name: Build
        working-directory: backend
        run: dotnet build api.IntegrationTests/api.IntegrationTests.csproj --no-restore --configuration Release

      - name: Test
        working-directory: backend
        run: dotnet test api.IntegrationTests/api.IntegrationTests.csproj --no-build --configuration Release --verbosity normal

      - name: Check for vulnerable packages
        working-directory: backend
        run: |
          dotnet list api.IntegrationTests/api.IntegrationTests.csproj package --vulnerable --include-transitive | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # This is what actually catches a broken image before Railway does --
      # `dotnet build`/`dotnet test` above never touch the Dockerfile itself,
      # so a change that breaks the image (missing file in a COPY, a project
      # reference the multi-stage build doesn't know about) would otherwise
      # only surface as a failed production deploy.
      - name: Build image
        run: docker build -t dolfin-api:ci -f backend/Dockerfile backend

      # Boots the actual built image against real Postgres + Redis containers
      # and waits for /health to return 200 -- the same check Railway's
      # deploy healthcheck (see railway.json) gates traffic cutover on.
      - name: Smoke test container startup and /health
        run: |
          docker network create dolfin-ci

          docker run -d --name postgres --network dolfin-ci \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres123 -e POSTGRES_DB=dolfin \
            postgres:17-alpine

          docker run -d --name redis --network dolfin-ci redis:7-alpine

          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U postgres && break
            sleep 1
          done

          docker run -d --name api --network dolfin-ci -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e ConnectionStrings__DefaultConnection="Host=postgres;Port=5432;Database=dolfin;Username=postgres;Password=postgres123" \
            -e ConnectionStrings__Redis="redis:6379" \
            -e JWT__SigningKey="ci-smoke-test-signing-key-not-a-real-secret-64-bytes-minimum-000" \
            -e JWT__Issuer="https://dol-fin.com" \
            -e JWT__Audience="https://dol-fin.com" \
            dolfin-api:ci

          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/health; then
              echo
              echo "Health check passed"
              exit 0
            fi
            sleep 1
          done

          echo "Health check never returned 200 within 30s"
          docker logs api
          exit 1
